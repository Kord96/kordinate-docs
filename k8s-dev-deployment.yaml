apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-dev
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs-dev
  template:
    metadata:
      labels:
        app: docs-dev
    spec:
      containers:
      - name: docs
        image: localhost:5000/docs:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 4321
          protocol: TCP
        env:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=2048"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /dev
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /dev
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: docs-dev
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: docs-dev
  ports:
  - name: http
    port: 80
    targetPort: http

site_name: Kordinate
site_url: https://kord96.github.io/kordinate/
site_description: A framework for kording specialized agents into a team
repo_url: https://github.com/Kord96/kordinate

theme:
  name: material
  logo: assets/logo_light.png
  favicon: assets/logo_light.png
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - navigation.expand

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - toc:
      permalink: true

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

nav:
  - Home: index.md
  - Architecture:
      - Overview: framework/overview.md
      - Guards: framework/guards.md
      - Kords: framework/kords.md
      - Recall System: framework/memory.md
  - Default Team:
      - agents/index.md
      - Scribe: agents/scribe.md
      - Beorn: agents/beorn.md
      - Deployer: infra/infrastructure.md
      - Sauron: infra/monitoring.md
  - Reference: reference/index.md
  - Dev Only:
      - Installation: dev/installation.md
      - Sessions & Branches: dev/sessions.md
      - Feature Inventory: dev/features.md

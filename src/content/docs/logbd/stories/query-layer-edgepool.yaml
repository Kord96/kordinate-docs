id: query-layer-edgepool
title: EdgePool — Direct DuckDB Connection Management
teaches: How the API bypasses Flight SQL for fast point lookups using direct DuckDB connections to snapshot files.
tags: [edgepool, duckdb, connection-pool, snapshots]

anchor:
  file: graphdb/api/edge_pool.py
  line: 1
  description: EdgePool manages direct read-only DuckDB connections to all snapshot files, refreshing when mtimes change.

parent: query-layer-overview
children: []

summary: |
  **graphdb-api** uses EdgePool instead of Flight SQL for point lookups because Flight SQL's ATTACH scans make the 259M-row emailed_with table take 150-400 seconds. EdgePool opens direct read-only connections to individual DuckDB snapshot files (11 node, 4 edge, 2 score, 10 derived DBs) and refreshes on file mtime changes. A warm cache loop pre-loads hot entities into EntityCache every 30 seconds, keeping most API responses under 50ms.

rationale:
  - id: rat-edgepool-vs-flight
    decision: Direct DuckDB connections via EdgePool instead of Flight SQL for API queries.
    context: Flight SQL attaches all DuckDB files into a single session, causing full table scans on ATTACH for large tables.
    trade_offs: Fast point lookups (<50ms) but requires managing 27+ individual connections with mtime-based refresh.
    alternatives: ["Flight SQL for all queries — rejected because emailed_with lookups took 150-400s via ATTACH scan."]

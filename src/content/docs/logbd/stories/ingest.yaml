  description: This is where a rawLog file becomes a batch of parsed messages published to the 'message' Kafka topic.

summary: |
  **message-producer** scans NFS for unprocessed rawLog slots and spawns one worker process per server file, publishing parsed FortiMail messages to Kafka. **entity-extraction** consumes those messages, extracts 9 typed entities via specialized extractors, computes MinHash cluster keys for LSH deduplication, and fans out each entity type to a dedicated Kafka topic. **metadata-archiver** consumes in parallel to persist per-message metadata.

  All three components run as separate k8s Deployments on vandc-61. The NFS mount is the sole ingest entry point — its unavailability silently stalls the entire pipeline.


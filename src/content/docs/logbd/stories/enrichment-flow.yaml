id: enrichment-flow
title: Domain Enrichment — Redis-Mediated Async Enrichment
teaches: How external enrichment (WHOIS, UCLT, CT, SPF, URI download) feeds the domain node without holding DuckDB write locks.
tags: ["enrichment", "redis", "whois", "uclt", "spf", "uri-download", "domain"]

parent: graph-store
children: []

anchor:
  file: graphdb/graph/node/domain/enrichment/whois_service.py
  line: 48
  description: This is the WHOIS refresh cycle — snapshot read → stale domain query → RDAP batch → Redis push.

summary: |
  Five **enrichment-services** run as independent pollers: WHOIS/RDAP, UCLT category, Certificate Transparency, SPF resolver, and URI downloader. Each reads domain.duckdb (snapshot, no write lock), queries stale domains, calls external APIs, and pushes results to Redis JSON lists. The domain consumer drains these queues on each flush and merges data into DuckDB.

  This Redis-mediated pattern decouples enrichment latency from consumer throughput. The URI poller uses a 200-worker asyncio thread pool and produces to the 'uri.download' topic. Redis failure aborts the enrichment cycle without fallback.

flows:
  - id: whois-enrichment-cycle
    title: WHOIS Enrichment Cycle
    type: data
    trigger: "WHOIS service wakes on interval (default 60s)"
    steps:
      - node: enrichment-services
        action: opens snapshot read of domain.duckdb, queries stale domains
        to: duckdb-node-store
        technology: DuckDB ATTACH (read-only)
      - node: enrichment-services
        action: runs RDAP batch (async, UCLT/relay fallback), aggregates results
        to: whois-rdap
        technology: HTTP (asyncio aiohttp)
      - node: enrichment-services
        action: pushes enrichment JSON to Redis list 'enrichment:result:whois'
        to: redis-cache
        technology: Redis RPUSH
      - node: node-consumers
        action: drains Redis list on flush, updates domain rows with registrar/creation date
        to: duckdb-node-store
        technology: DuckDB upsert


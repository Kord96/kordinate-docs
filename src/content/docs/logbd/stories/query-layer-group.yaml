summary: |
  **graphdb-api** serves 15 REST endpoints via FastAPI with token-based authentication. It queries **flight-sql** over gRPC for entity data, caching results in a tiered EntityCache warmed by EdgePool. **flight-sql** opens DuckDB in-memory connections over MinIO Parquet snapshots, creating unified entity views that join base, inline, and derived tables. **graphdb-client** provides a Click CLI and Python SDK with disk caching, Loki logging, and multiple output formats. **sentinel** monitors all 25+ pipeline processes and exports composite health metrics.


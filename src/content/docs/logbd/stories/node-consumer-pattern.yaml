anchor:
  file: graphdb/graph/node/base/store.py
  line: 77
  description: This is NodeStore.get_known_keys() — the in-memory cache that prevents redundant DuckDB lookups for already-persisted entities.

summary: |
  Each of 9 node consumers runs the same stoik loop: Kafka messages accumulate in NodeBuffer (per-minute traffic aggregation), flush at 30-second intervals or 10K messages, and persist to NodeStore (DuckDB). After each flush, NodeStore writes a Parquet snapshot to MinIO. NodeStore maintains a 200K-key in-memory cache of known entity keys, evicting 50% when full.

  Traffic history compacts hourly: per-minute buckets roll up to hourly/daily. Entity-specific subclasses only implement `upsert_batch()`. DuckDB lock contention with derived-refresh is handled by `_connect_with_retry` with up to 60 attempts.


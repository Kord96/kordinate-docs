summary: |
  **score-consumer** subscribes to two Kafka topics: score.external_source (FortiGuard fg_scores, reference list matches) and score.signal (ML classifier outputs). ScoreBuffer accumulates records by type, and on flush writes external scores to external_score.duckdb and ML signals to signal.duckdb. Each score carries entity_type, entity_key, a numeric score, source identifier, and timestamp. The API joins these at query time via EdgePool snapshot connections.

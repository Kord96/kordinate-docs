summary: |
  **node-consumers** and **edge-consumers** form the core graph engine. Each consumer subscribes to one or more Kafka topics, buffers incoming records, and flushes batches to per-entity DuckDB files using PyArrow. The stoik framework provides the `Buffer`/`Store`/`consume()` loop. **enrichment-service** adds WHOIS, certificate transparency, and UCLT category data to domain nodes via external APIs. **derived-refresh** continuously recomputes aggregate properties across seven tiers (A through G), including community detection via graph algorithms.


id: api-failure-modes
title: API Failure Modes — What Breaks When Dependencies Go Down
teaches: How the REST API degrades when Kafka, MinIO, or DuckDB snapshot files are unavailable.
tags: ["failure", "resilience", "minio", "kafka", "duckdb", "degraded"]

parent: query-api
children: []

anchor:
  file: graphdb/api/routers/health.py
  line: 18
  description: This is the /health endpoint — checks EdgePool and FlightPool status; returns 'degraded' if EdgePool connections are missing.

summary: |
  **graphdb-api** has three failure modes. EdgePool loss: /health returns 'degraded' and all node lookups return empty — full read degradation. Flight SQL loss: /health reports ok but bulk export and classifier queries fail silently. MinIO down: snapshots stop refreshing; EdgePool serves stale data until connections are replaced.

  The sentinel thread queries Prometheus every 30 seconds for per-consumer pipeline_process_status gauges and assembles composite pipeline_status metrics — giving operators a single view of all 32 pods without querying each directly.

flows:
  - id: kafka-failure-cascade
    title: Kafka Broker Failure Cascade
    type: event
    trigger: Single Kafka broker becomes unavailable (no replication)
    severity: critical
    detection: ["pipeline_consumed_total counters stop incrementing", "consumer lag grows in kafka_exporter", "sentinel pipeline_process_status FAIL"]
    recovery: ["Restart Kafka broker; consumers auto-reconnect; messages produced during outage are permanently lost"]
    steps:
      - node: message-producer
        effect: publish_batch() fails; messages discarded (no retry queue)
        technology: confluent-kafka
      - node: entity-extraction
        effect: poll() blocks indefinitely; no entity topics produced
        technology: confluent-kafka
      - node: node-consumers
        effect: flush never triggered; DuckDB writes stop; data goes stale
        technology: confluent-kafka

observations:
  - id: obs-single-kafka-broker
    finding: "**kafka-broker** is a single broker with no replication — broker failure halts the entire pipeline with no message recovery"
    confidence: high
    component: kafka-broker
    grounded_in: ["deploy/graphdb/infra/kafka.yaml:1"]
    evidence:
      file: deploy/graphdb/infra/kafka.yaml
      lines: [1, 30]
    tags: ["resilience", "kafka", "single-point-of-failure"]
    detection_method: manual
    recommendation: "Add a second Kafka broker with replication factor 2 for the message and entity topics; or accept the single-broker limitation and document the recovery procedure"


anchor:
  file: classifier/classifier/infer.py
  line: 86
  description: This is the infer() function — loads model, queries Flight SQL for features, clips scores to [-1, 1], publishes to Kafka.

summary: |
  **classifier-scheduler** runs three schedules: every 30 minutes (weighted_sum, infra_infer, release), daily 03:00-04:59 UTC (feature export, infra retrain), weekly Sunday 02:00 (full LightGBM spam_classifier retrain). Each job runs as a subprocess so memory is fully reclaimed between runs.

  infer.py queries features via Flight SQL, aligns to training columns (missing filled with -1), runs LightGBM predict, clips to [-1.0, +1.0], publishes to score.signal with a 30-minute dedup window. Training failures write `.candidate.metrics.json`; the scheduler increments `model_validation_failed` gauge.


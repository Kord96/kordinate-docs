summary: |
  **entity-extraction** consumes from the 'message' topic and extracts IPs, URIs, email addresses, CKMs, and metadata. `ExtractionBuffer.add()` calls five extractor functions that route entities to typed lists. On flush, each list is published as JSON to its dedicated Kafka topic.

  The same flush cycle builds `message_role` linkage rows, `emailed_with` association edges, and MinHash cluster records. SPF authorization checks run against Redis when available. Multi-worker mode uses `multiprocessing.Process` with fail-fast semantics.


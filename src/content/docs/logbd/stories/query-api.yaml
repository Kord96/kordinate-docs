anchor:
  file: graphdb/api/edge_pool.py
  line: 79
  description: This is EdgePool — the direct DuckDB connection manager that backs all point-lookup API requests.

summary: |
  **graphdb-api** serves 30+ REST endpoints via FastAPI. Point lookups (GET /node/{type}/{key}) go through EdgePool — long-lived read-only DuckDB connections to snapshot files with per-connection locks for thread safety. Hot entities are pre-loaded in a tiered cache (warm tier refreshed every 30 seconds, LRU tier per entity type). **flight-sql** exposes Arrow Flight SQL (gRPC port 8815) backed by DuckDB views over MinIO Parquet files — used for bulk columnar queries by the classifier and admin tooling.

  All API traffic is authenticated via Bearer token middleware. **graph-client** wraps both paths as a pip-installable SDK with a local disk cache for subgraph results.


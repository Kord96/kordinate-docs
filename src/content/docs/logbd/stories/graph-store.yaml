  description: This is the generic consumer loop all 9 node consumers share — buffer, flush_interval, store, compact.

summary: |
  **node-consumers** (9), **edge-consumers** (3), and **score-consumer** each own a DuckDB file and run the same stoik loop: accumulate in NodeBuffer, flush every 30 seconds, write a Parquet snapshot to MinIO. **enrichment-services** (WHOIS, UCLT, CT, SPF, URI download) read domain snapshots, call external APIs, and push results to Redis queues for the domain consumer to drain.

  The 27 consumers collectively maintain 9 node tables, 4 edge tables, and 2 score tables. No shared state exists between consumers except via Kafka topics and Redis queues.


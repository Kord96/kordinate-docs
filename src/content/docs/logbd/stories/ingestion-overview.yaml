summary: |
  **message-producer** scans NFS-mounted rawLog directories for new time slots, parses FortiMail log files, and publishes structured messages to Kafka. **entity-extraction** consumes those messages, splits each into 9 entity types (domain, host, subnet, uri, email, text, image, content_template, cluster), and routes them to per-type Kafka topics. This two-stage design decouples log parsing from entity routing, allowing each to scale and fail independently.


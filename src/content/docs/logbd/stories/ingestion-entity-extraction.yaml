id: ingestion-entity-extraction
title: Entity Extraction — Message to Graph Entities
teaches: How a single parsed message becomes multiple typed entity records routed to separate Kafka topics.
tags: [ingestion, entity-extraction, fan-out, kafka]

anchor:
  file: graphdb/data_source/logServer/entity_extraction/consumer.py
  line: 68
  description: The ExtractionBuffer.add() method where a message is decomposed into entities, edges, associations, and cluster records.

parent: ingestion-overview
children: []

summary: |
  **entity-extraction** consumes from the Kafka `message` topic and fans out to 30+ per-type topics. ExtractionBuffer.add() calls five extractors (IPs, URIs, email addresses, CKMs, metadata), builds emailed_with co-occurrence pairs, and computes MinHash cluster records via LSH banding. On flush, entities are published as JSON to per-type topics, and message-entity linkage is written to DuckDB. Multi-worker mode via Python multiprocessing terminates all survivors if any worker dies, triggering a clean systemd restart.

flows:
  - id: extraction-fan-out
    title: Message Fan-out
    type: data
    trigger: Kafka message consumed from 'message' topic
    steps:
      - node: entity-extraction
        action: Deserializes Kafka message
        data: Parsed FortiMail log record
        technology: confluent-kafka (Avro or JSON)
      - node: entity-extraction
        action: Runs 5 extractors to decompose message into entity records
        data: Per-type entity records (domain, host, subnet, uri, email_address, text, image, content_template)
        transform: One message becomes N entity records with deduplication keys
      - node: entity-extraction
        action: Builds emailed_with associations and MinHash cluster records
        data: Co-occurrence pairs, LSH band hashes
      - node: entity-extraction
        action: Flushes to Kafka topics and DuckDB stores
        data: Entity records to per-type topics, edge rows to message_role.duckdb
        technology: Kafka JSON + DuckDB bulk insert


parent: graph-engine-group
children: []

summary: |
  **enrichment-service** runs three independent consumers: WHOIS (domain registration via RDAP), certificate transparency (CT log queries), and UCLT (FortiGuard URL classification). Each writes results directly to the domain DuckDB file. New domains are prioritized; stale enrichments refresh opportunistically.

  Redis caches WHOIS/DNS results to avoid hammering external APIs. The enrichment backlog metric tracks active domains needing enrichment. No circuit breaker protects against slow or unresponsive registries.


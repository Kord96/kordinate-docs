  description: This is the typed API wrapper that all CLI commands and SDK callers use.

summary: |
  **graph-client** is a pip-installable Python package providing a typed API wrapper and 15+ CLI commands. It authenticates with a Bearer token, stores config in ~/.config/graph-client/, and caches subgraph results to disk. The `stream` command connects to the Loki log endpoint for real-time log tailing. All commands use the same REST API as the **graphdb-api** server.


summary: |
  **classifier-infer** loads trained LightGBM models per entity type, queries feature matrices from **flight-sql**, and publishes spam probability scores to the `score.signal` Kafka topic. **classifier-scheduler** runs inference, training, seeding, and release jobs on configured intervals as subprocess invocations with timeouts. Scores flow back into the graph via the score consumer, closing the feedback loop between classification and graph construction.


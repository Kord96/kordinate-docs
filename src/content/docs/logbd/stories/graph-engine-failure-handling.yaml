id: graph-engine-failure-handling
title: DuckDB Lock Contention and Recovery
teaches: How the graph engine handles DuckDB file-level lock contention and what happens when retention competes with consumers.
tags: [resilience, duckdb, lock-contention, retry]

anchor:
  file: graphdb/graph/retention_utils.py
  line: 62
  description: connect_with_retry() — the shared retry logic used by all graph components when opening DuckDB files under contention.

parent: graph-engine-overview
children: []

summary: |
  DuckDB uses file-level exclusive locks for writes. When **node-consumers** flush while retention or **derived-refresh** holds a lock, the flush fails with IOException. All store paths use connect_with_retry (30 retries, base 50ms, max 2s with jitter). NodeStore.reconnect() reopens connections without re-running DDL, re-applying session settings per-connection. The cgroup-aware `db.py` reads /sys/fs/cgroup/memory.high and allocates 70% to DuckDB, falling back to 4GB if no cgroup limit is found.

flows:
  - id: lock-contention-recovery
    title: DuckDB Lock Contention Recovery
    type: resource
    trigger: Consumer flush encounters DuckDB file lock held by retention or derived-refresh
    steps:
      - node: node-consumers
        action: Attempts to open DuckDB file for write
        resource: DuckDB file-level lock
        operation: acquire
        constraints: Exclusive lock required for writes
      - node: node-consumers
        action: IOException caught, retry with exponential backoff
        resource: DuckDB file-level lock
        operation: acquire
        constraints: 30 retries, base 50ms, max 2s, jitter +/- 30%
      - node: node-consumers
        action: Lock acquired, flush proceeds
        resource: DuckDB file-level lock
        operation: use
      - node: node-consumers
        action: Connection closed or released after flush
        resource: DuckDB file-level lock
        operation: release

summary: |
  **message-producer** runs a two-phase loop. Phase 1 inventories all NFS day directories every 10 minutes, discovering slot IDs from rawLog filenames matching `{server}.{slot_id}.gz`. Phase 2 iterates unprocessed slots, delegating to `MessageProducer.process_slot()` which parses each gz file and publishes messages to Kafka.

  Progress tracking uses a local DuckDB `processed_slots` table. Restarts resume from the last checkpoint. Prometheus gauges track observed vs processed slot range for alerting. No circuit breaker protects against sustained NFS outages.


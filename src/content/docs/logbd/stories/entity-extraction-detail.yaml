  description: This is ExtractionBuffer — the accumulator that collects entities from one message before routing them to per-type Kafka topics.

summary: |
  **entity-extraction** consumes the 'message' topic and runs typed extractors: IPs collapsed to /24 subnets, URIs fingerprinted by path+query, email addresses by local part, CKM hashes for text/image/template, and MinHash cluster keys over 5 feature sets. Each entity type routes to its own Kafka topic.

  The consumer also writes message-entity linkage rows to message_role.duckdb (sender, recipient, relay roles). Redis carries enrichment results from external services to the domain consumer for WHOIS, UCLT, and CT data.


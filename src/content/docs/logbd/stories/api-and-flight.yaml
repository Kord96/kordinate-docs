id: api-and-flight
title: "REST API and Flight SQL: Two Query Interfaces"
teaches: "How the REST API delegates to Flight SQL and how both serve entity data."
tags: ["api", "flight-sql", "fastapi", "grpc", "cache"]

anchor:
  file: "graphdb/api/app.py"
  line: 174
  description: "create_api() wires stoik's API factory with graphdb-specific routers and EdgePool."

parent: query-layer-group
children: []

summary: |
  **graphdb-api** uses stoik's `create_api()` factory with 15 routers, `AuthMiddleware` for Bearer token validation, and a background `EdgePool` thread warming the `EntityCache`. Route handlers delegate to a `FlightPool` managing DuckDB connections via Arrow Flight SQL.

  **flight-sql** runs on gRPC port 8815, opening in-memory DuckDB connections over MinIO Parquet snapshots with unified `entity_*` views. The connection pool refreshes when file mtimes change. The server has no authentication — any client with network access can run arbitrary SQL.

observations:
  - id: obs-flight-no-auth
    finding: "**flight-sql** has no authentication. Any client with network access can run arbitrary SQL queries against the full graph."
    confidence: high
    component: flight-sql
    evidence:

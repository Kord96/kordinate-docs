      lines: [164, 166]
      snippet: "server = FlightSQLServer(location, open_connection=_open_connection, ...)"
    tags: ["security", "critical"]
    detection_method: "manual"
    recommendation: "Add token-based auth to the Flight SQL server using the same TokenStore."
    grounded_in: ["graphdb/api/flight.py:166"]

rationale:
  - id: minio-snapshot-architecture
    decision: "Use MinIO Parquet snapshots for the Flight SQL read path instead of direct DuckDB file access."
    context: "DuckDB file locks prevent concurrent reads during consumer writes. Snapshots provide isolation."
    trade_offs: "Read staleness (snapshot lag) vs zero lock contention on the read path."
    alternatives: ["Direct DuckDB read-only mode -- rejected because DuckDB WAL checkpointing still blocks readers."]

summary: |
  **message-producer** polls NFS every 60 seconds for new rawLog slots, parses gz-compressed log files from FortiMail servers, and publishes structured Avro records to the Kafka 'message' topic. **entity-extraction** consumes these messages and fans out 14 entity types to dedicated Kafka topics, while simultaneously writing message-entity linkage rows and cluster records to DuckDB. **metadata-archiver** captures FortiMail device inventory alongside the main pipeline.


id: query-layer-api-auth
title: Token Authentication and Access Control
teaches: How API tokens are managed, activated on first use, and enforced via middleware.
tags: [auth, tokens, middleware, security]

anchor:
  file: graphdb/api/auth.py
  line: 343
  description: AuthMiddleware.dispatch() — the Starlette middleware that validates Bearer tokens on every non-exempt request.

parent: query-layer-overview
children: []

summary: |
  **graphdb-api** uses a DuckDB-backed TokenStore with in-memory cache (refreshed every 60s). Tokens are generic access keys with an is_admin flag — user identity comes from the client's X-Graph-User header, not the token itself. New tokens expire after 7 days if never used; first use activates them permanently by clearing expires_at. AuthMiddleware exempts /health and /metrics, rejects missing/invalid tokens with 401, and records per-user request metrics (counter + histogram).

  Admin endpoints (/admin/tokens) are gated by the is_admin flag. The token schema self-migrates from older formats (username-based to admin-flag-based) on startup, preserving existing tokens through the transition.


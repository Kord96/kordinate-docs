summary: |
  **derived-refresh** runs a continuous round-robin loop refreshing up to 10K stale entities per type per cycle. Tiers A through F compute traffic aggregates, message joins, reputation lookups, multi-hop traversals, per-group aggregations, and static properties. Tier G runs every 6 hours for community detection across edge tables.

  After each refresh, derived tables are exported as Parquet to MinIO for **flight-sql** access. Staleness metrics track the oldest `last_computed_at` per entity type, alerting when any exceeds 2 hours.


  - id: derived-tier-flow
    title: "Derived Tier Computation"
    type: "data"
    trigger: "Continuous round-robin, Tier G every 6 hours."
    steps:
      - node: derived-refresh
        action: "Queries base DuckDB for entities where last_computed_at is oldest."
        data: "Batch of 10K entity keys."
        technology: "DuckDB"
      - node: derived-refresh
        action: "Runs tiers A through F sequentially per entity."
        data: "Computed derived columns."
        technology: "DuckDB SQL with cross-DB ATTACH"
        transform: "Raw entity data gains traffic stats, message counts, reputation scores, traversal results."
      - node: derived-refresh
        action: "Exports updated derived tables as Parquet to MinIO."
        to: flight-sql
        data: "Parquet files per entity type."
        technology: "DuckDB httpfs to MinIO S3"


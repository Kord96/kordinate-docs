summary: |
  **derived-refresh** computes analytical columns in seven tiers: A (5min, traffic aggregation), B (10min, cross-DB joins), C (1h, reputation lookups), D (6h, multi-hop traversals), E (24h, aggregations), F (once, static properties), and G (batch graph algorithms via SciPy). Each cycle selects stalest entities, determines needed tiers by staleness, and runs tier functions against a _batch_keys temp table. Backfill mode (>80% new keys) restricts to tiers A and F. Results are bulk-upserted via PyArrow temp table.


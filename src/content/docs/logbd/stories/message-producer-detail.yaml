rationale:
  - id: rat-spawn-not-fork
    decision: "Use multiprocessing 'spawn' context instead of 'fork'"
    context: "confluent_kafka's librdkafka holds internal pthread mutexes; forking a process with active mutexes causes deadlocks in child workers"
    trade_offs: "Each spawned worker takes ~2s to initialize (load reference data, configure Kafka); slower startup than fork but guaranteed clean state"
    alternatives: ["fork — rejected due to mutex inheritance deadlocks documented in confluent_kafka and DuckDB"]


  description: This is where a pool of spawned processes is created — one per rawLog file, using 'spawn' to avoid inheriting confluent_kafka mutex state.

summary: |
  **message-producer** discovers rawLog slots on NFS, spawns a multiprocessing Pool using 'spawn' context (not fork) — one worker per rawLog file, up to cpu_count workers. Each worker loads reference data, configures its own Kafka producer, parses gzip records, and batches 5000 messages to the 'message' topic.

  The spawn context is load-bearing: confluent_kafka mutexes cause deadlocks if inherited via fork. Workers warn above 2 GB RSS. A 10-minute hard timeout aborts stalled slots. NFS mount failure is detected via statvfs() but not retried.


id: analytics
title: Analytics — Derived Signals and ML Classification
teaches: How 72 derived signals are computed from the raw graph and how LightGBM produces spam scores every 30 minutes.
tags: ["ml", "lightgbm", "graph-algorithms", "derived", "pagerank", "spam"]


anchor:
  file: graphdb/graph/derived/tiers/tier_g.py
  line: 1
  description: This is where the full emailed_with + association graphs are loaded into scipy sparse matrices for PageRank, label propagation, and BFS.

summary: |
  **derived-refresh** iterates all entity types in round-robin, computing 7 tiers of signals: traffic aggregation (A), cross-DB message joins (B), reputation lookups (C), multi-hop traversals (D), per-group aggregations (E), static properties (F), and graph algorithms (G — every 6 hours). Tier G loads 100M+ edges into scipy sparse matrices and runs PageRank, label propagation, connected components, and BFS spam distance.

  **classifier-scheduler** wakes every 30 minutes, fetches entity features from Flight SQL, runs LightGBM inference to produce signed spam scores [-1, +1], and publishes them to the score.signal Kafka topic. Weekly retraining updates the model from freshly exported DuckDB features.


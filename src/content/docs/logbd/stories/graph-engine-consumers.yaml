  description: NodeStore — the DuckDB persistence base class that all entity consumers extend.

parent: graph-engine-overview
children: []

summary: |
  Each **node-consumers** instance extends NodeStore, which inherits from stoik's Store and adds a known-key cache (200K entries, half-eviction), PyArrow-based traffic history recording, and traffic history compaction. The consumer loop polls Kafka, calls entity-specific parse_message to populate a NodeBuffer, then flushes on interval (30s) or batch threshold (10K messages). Flush calls upsert_batch (INSERT ON CONFLICT) and record_traffic_batch (minute-resolution traffic counters).

  **edge-consumers** follow the same pattern but manage pairwise edge tables (emailed_with with traffic/spam_traffic counters, association with relationship types, cluster_member with cluster keys). All DuckDB writes use PyArrow temp table registration for bulk performance, avoiding per-row executemany overhead.

rationale:
  - id: rat-single-writer
    decision: Each DuckDB file has exactly one writer process.
    context: DuckDB uses file-level exclusive locks for writes, making concurrent writers impractical.
    trade_offs: Simplifies concurrency (no distributed locking) but limits write throughput to one process per entity type.
    alternatives: ["Shared database (PostgreSQL) would allow concurrent writers but at 10x storage cost for this data volume."]

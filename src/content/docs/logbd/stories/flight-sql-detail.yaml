rationale:
  - id: rat-two-query-paths
    decision: "Two separate query paths: EdgePool (REST point lookups) and Flight SQL (bulk columnar)"
    context: "Flight SQL over MinIO Parquet requires full table scans that take minutes on large edge tables"
    trade_offs: "EdgePool gives sub-second point lookups at the cost of maintaining direct DuckDB connections; Flight SQL gives columnar access for arbitrary SQL at the cost of query latency"
    alternatives: ["Single Flight SQL path — rejected due to 150-400s scan times on 259M-row tables"]


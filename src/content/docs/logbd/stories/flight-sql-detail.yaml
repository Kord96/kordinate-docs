id: flight-sql-detail
title: Arrow Flight SQL — Parquet-over-MinIO for Bulk Queries
teaches: How Flight SQL provides columnar bulk access by reading Parquet snapshots from MinIO via DuckDB.
tags: ["flight-sql", "arrow", "grpc", "minio", "parquet", "duckdb", "columnar"]

parent: query-api
children: []

anchor:
  file: graphdb/lib/dbpool.py
  line: 11
  description: This is open_graph() — creates DuckDB views over Parquet files in MinIO, one schema per snapshot.

summary: |
  **flight-sql** runs the stoik FlightSQLServer on gRPC port 8815. Each connection calls `open_graph()`, which creates an in-memory DuckDB and ATTACHes MinIO Parquet files via `s3://` glob. Release DuckDB files (classifier output) are reflink-copied to a temp directory and attached separately — isolating writable files from the read-only session.

  `api/views.py` joins base + derived + score tables into unified `entity_{type}` views for classifier feature queries. Connections refresh when snapshot mtimes change. Flight SQL is too slow for point lookups (150-400s on 259M-row tables) — hence EdgePool for REST.


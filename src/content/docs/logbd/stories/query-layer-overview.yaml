summary: |
  **graphdb-api** serves 16 REST endpoints via FastAPI with Bearer token auth, backed by direct DuckDB connections through EdgePool. **flight-sql** provides a gRPC interface for analytical SQL queries used by the classifier. **graph-client** is a Click CLI with disk caching and Loki logging. **mcp-server** wraps the REST API as LLM-friendly tools via FastMCP. All four share the same underlying DuckDB snapshot files but use different access patterns — EdgePool for point lookups, Flight SQL for full table scans.


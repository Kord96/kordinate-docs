summary: |
  **classifier-infer** loads a LightGBM model and metadata from `/opt/data/logbd/models/`, queries entity features from **flight-sql** (filtering to traffic >= 10), and aligns columns to the training feature set. A dedup step skips entities scored within 30 minutes.

  Scores are clipped to [-1, +1] and published to `score.signal` in Kafka batches. **classifier-scheduler** runs inference alongside training and release jobs as subprocesses with configurable timeouts.


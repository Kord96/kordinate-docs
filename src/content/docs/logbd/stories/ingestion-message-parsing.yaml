summary: |
  **message-producer** runs a two-phase loop. Phase 1 (inventory) scans all NFS day directories every 10 minutes, building a slot map and updating Prometheus gauges. Phase 2 (ingestion) processes unprocessed slots, parsing each rawLog file and publishing to Kafka with lz4 compression. A DuckDB progress database prevents duplicate ingestion across restarts. The service uses systemd sd_notify for watchdog integration and kills orphaned workers on startup.

observations:

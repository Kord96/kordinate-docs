summary: |
  **classifier-scheduler** runs three job tiers: periodic (every 30 min — weighted_sum, infra inference, release), daily (03:00-05:00 UTC — dataset export/prepare/cleanup with infra seed/train/infer), and weekly (Sunday 02:00-04:00 — full spam classifier retrain). Each job runs as a subprocess for memory isolation. The scheduler queries entity features via Flight SQL, runs LightGBM inference, and publishes scores to the Kafka score.signal topic for the **score-consumer** to persist.


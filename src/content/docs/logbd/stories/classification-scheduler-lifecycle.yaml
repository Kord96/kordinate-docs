id: classification-scheduler-lifecycle
title: Scheduler Job Lifecycle and Subprocess Isolation
teaches: How the scheduler manages job execution windows, state persistence, and memory isolation via subprocesses.
tags: [scheduler, subprocess, lifecycle, ml]

anchor:
  file: classifier/scheduler/runner.py

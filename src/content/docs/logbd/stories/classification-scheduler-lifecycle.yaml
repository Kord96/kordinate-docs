  description: run_job() — the subprocess executor that manages timeouts, metrics, and error handling for each classifier job.

parent: classification-overview
children: []

summary: |
  **classifier-scheduler** uses subprocess.run for each job so Python fully reclaims memory between runs. Job state (last_daily_run, last_weekly_run) is persisted to JSON with atomic rename for crash safety. Daily jobs have a 20-hour cooldown, weekly a 6-day cooldown, preventing duplicate runs after restarts. Training scripts write `.candidate.metrics.json` on validation failure; the scheduler scans for these, increments the model_validation_failed gauge, and deletes the file.


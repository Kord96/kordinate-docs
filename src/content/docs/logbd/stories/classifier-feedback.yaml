summary: |
  Scores from **classifier-infer** arrive on the `score.signal` and `score.external_source` Kafka topics. The score consumer in **node-consumers** upserts them into a per-entity DuckDB file with source, timestamp, and score value. **derived-refresh** tier C reads these scores during reputation lookups, folding ML signals into the entity's aggregate verdict.

  External blocklist scores (Spamhaus DBL, SBL) enter through `score.external_source`, using the same consumer. This unifies ML and rule-based classification into a single scoring pipeline.


summary: |
  **node-consumers** (11 entity types) and **edge-consumers** (3 edge types) subscribe to per-type Kafka topics and persist records to individual DuckDB files via stoik's stream-to-store pattern. **derived-refresh** periodically recomputes 72 analytical signals across tiers A-G, attaching base DuckDB files read-only and running SQL computations in batch. All consumers share a common Buffer/Store abstraction with Prometheus metrics, traffic history tracking, and DuckDB lock contention retry.


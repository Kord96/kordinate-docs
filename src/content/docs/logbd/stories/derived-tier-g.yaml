  description: This is where the full property graph is loaded into scipy.sparse.csr_matrix and 6 graph algorithms run in sequence.

summary: |
  Tier G runs every 6 hours inside **derived-refresh**. It attaches snapshot DuckDB files (emailed_with, association, cluster_member), exports COO arrays via `fetchnumpy()` (avoids Python tuple overhead), builds CSR matrices with int32 indices, and runs 6 algorithms: PageRank, label propagation from spam seeds, connected_components, per-community spam ratio, multi-source BFS spam distance, and 3-hop reachability.

  Memory is managed explicitly: COO arrays deleted after CSR construction, matrices freed between algorithms. Results bulk-written to all 9 derived tables via PyArrow. The 6-hour interval balances freshness against loading 100M+ edges.

flows:
  - id: tier-g-flow
    title: Tier G Graph Algorithm Execution
    type: data
    trigger: "6-hour timer in derived-refresh service (last_tier_g elapsed >= 21600s)"
    steps:
      - node: derived-refresh
        action: attaches snapshot DuckDB files (reflink copies), exports COO arrays via fetchnumpy()
        to: duckdb-edge-store
        technology: DuckDB ATTACH (read-only snapshot)
      - node: derived-refresh
        action: builds CSR matrices (int32 indices), runs 6 scipy algorithms
        to: derived-refresh
        technology: scipy.sparse + numpy
      - node: derived-refresh
        action: bulk-writes per-node algorithm results to all 9 derived tables
        to: duckdb-derived-store
        technology: PyArrow INSERT via DuckDB


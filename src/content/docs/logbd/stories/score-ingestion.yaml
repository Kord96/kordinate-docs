id: score-ingestion
title: Score Ingestion — External Reputation and ML Signals
teaches: How FortiGuard/Spamhaus reputation scores and ML classifier signals are stored separately and queried together.
tags: ["scoring", "kafka", "duckdb", "lightgbm", "external-scores"]

parent: graph-store
children: []

anchor:
  file: graphdb/graph/score/consumer.py
  line: 65
  description: This is the score consumer — two Kafka topics routed to two separate DuckDB files based on message schema.

summary: |
  **score-consumer** subscribes to score.external_source and score.signal simultaneously, distinguishing topics by whether 'threshold' exists in the message body. External scores (FortiGuard, Spamhaus, integer 1-9) go to external_score.duckdb; ML signals (LightGBM float -1.0 to +1.0) go to signal.duckdb. Both are snapshotted to MinIO after each flush.

  **derived-refresh** joins these tables in Tier C for per-entity reputation aggregates. **graphdb-api** exposes both in the node response. The threshold field also enables infer.py deduplication to skip recently scored entities.


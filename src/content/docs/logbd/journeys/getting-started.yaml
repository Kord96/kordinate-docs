id: getting-started
number: 1
title: "Getting Started: Log to Graph to Query"
description: "Follow a FortiMail log line from NFS mount through Kafka, DuckDB, and MinIO to a queryable graph node."
audience: ["new-developer", "operator"]
overview: |
  logBD is a stream processing pipeline that turns FortiMail network logs into a queryable property graph. Raw log files arrive on an NFS mount, get parsed into Kafka messages, fan out into 14 entity types, persist to per-entity DuckDB files, compute derived properties across seven tiers, snapshot to MinIO as Parquet, and become queryable via REST API and Flight SQL. This journey follows that path end to end.
stories:
  - data-source-group
  - log-ingestion
  - entity-fan-out
  - graph-engine-group
  - consumer-architecture
  - query-layer-group
  - api-and-flight
bridges:
  - from: data-source-group
    to: log-ingestion
    text: "How does the message producer discover and parse rawLog files from NFS?"
  - from: log-ingestion
    to: entity-fan-out
    text: "Once messages are in Kafka, how do they become 14 distinct entity types?"
  - from: entity-fan-out
    to: graph-engine-group
    text: "Entity records are now on dedicated Kafka topics. How do they become graph nodes?"
  - from: graph-engine-group
    to: consumer-architecture
    text: "What pattern do all 15+ consumers share, and how does DuckDB persistence work?"
  - from: consumer-architecture
    to: query-layer-group
    text: "Entities are in DuckDB. How do analysts query the graph?"
  - from: query-layer-group
    to: api-and-flight
    text: "What sits between the REST API and the DuckDB files?"

id: getting-started
title: Getting Started with logBD
description: Trace a FortiMail log line from NFS mount through entity extraction, graph storage, derived analytics, and ML classification to a queryable API response.
audience: [new-developer, operator]
stories:
  - ingestion-overview
  - ingestion-message-parsing
  - ingestion-entity-extraction
  - graph-engine-overview
  - graph-engine-derived-tiers
  - query-layer-overview
  - classification-overview
bridges:
  - from: ingestion-overview
    to: ingestion-message-parsing
    text: "Log files become Kafka messages. But how does the producer discover and track which slots have been processed?"
  - from: ingestion-message-parsing
    to: ingestion-entity-extraction
    text: "Messages are now in Kafka. But how does one message become 9 different entity types routed to 30+ topics?"
  - from: ingestion-entity-extraction
    to: graph-engine-overview
    text: "Entities are fanning out to per-type topics. But who consumes them and where does the data land?"
  - from: graph-engine-overview
    to: graph-engine-derived-tiers
    text: "Raw entities are stored in DuckDB. But how do 72 analytical signals get computed from base data?"
  - from: graph-engine-derived-tiers
    to: query-layer-overview
    text: "Derived signals are computed. But how do analysts and agents actually query this data?"
  - from: query-layer-overview
    to: classification-overview
    text: "The graph is queryable. But how does the ML classifier use these signals to produce spam verdicts?"

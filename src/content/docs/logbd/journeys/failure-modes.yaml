id: failure-modes
number: 2
title: "Failure Modes: What Breaks and What Happens"
description: "Walk through each external dependency and trace the cascade when it fails."
audience: ["operator", "on-call"]
overview: |
  logBD depends on 6 external services: NFS, Kafka, MinIO, Redis, Schema Registry, and WHOIS/RDAP APIs. Each failure has a different blast radius. NFS and Kafka failures stop all new data. MinIO failures break queries but not ingestion. Redis and WHOIS failures degrade enrichment gracefully. This journey maps each failure cascade.
stories:
  - data-source-group
  - log-ingestion
  - graph-engine-group
  - enrichment-pipeline
  - health-monitoring
  - api-and-flight
bridges:
  - from: data-source-group
    to: log-ingestion
    text: "What happens when NFS becomes unreachable during ingestion?"
  - from: log-ingestion
    to: graph-engine-group
    text: "If Kafka goes down, how far does the failure cascade?"
  - from: graph-engine-group
    to: enrichment-pipeline
    text: "Can enrichment continue when graph consumers are stalled?"
  - from: enrichment-pipeline
    to: health-monitoring
    text: "How does the sentinel detect these failures?"
  - from: health-monitoring
    to: api-and-flight
    text: "When MinIO is down, can the API still serve queries?"

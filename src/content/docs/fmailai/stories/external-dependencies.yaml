summary: |
  The system depends on 6 external services: Kafka (request/response messaging), Aerospike (email records and profiles), MongoDB (config and classifier registry), Qdrant (vector similarity), an external LLM inference server (content risk), and legacy MySQL (config change flags). All run as Docker Compose services on a shared bridge network except the LLM server, which is at a hardcoded IP. Only the LLM client has a timeout. None have circuit breakers, retries, or structured fallback behavior.


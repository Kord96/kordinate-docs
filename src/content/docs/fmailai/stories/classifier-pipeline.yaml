id: classifier-pipeline
title: "Classifier Pipeline"
teaches: "How the ordered classifier chain evaluates emails and the strategy/chain-of-responsibility pattern that drives it."
tags: ["classifiers", "strategy-pattern", "chain-of-responsibility"]

anchor:
  file: "pipeline.py"
  line: 150
  description: "Pipeline.process() iterating through sorted classifiers and short-circuiting on first verdict."

parent: classification-engine
children: []

summary: |
  **classification-pipeline** implements chain-of-responsibility via Pipeline. Classifiers load dynamically from MongoDB via __import__, sorted by ClassifierID enum. Each implements Classifier.predict() returning a Verdict enum. The chain iterates until non-Unknown or timeout (600s default).

  PipelineManager handles pre-classification: Aerospike cache lookups, trusted-sender bypass for good-SPF, and HTML/content parsing. Four daemon threads insert emails to database via queue.Queue. Post-classification, FNSubmission rules may rewrite Clean to Newsletter. ClassifierID ordering (200-20010) establishes priority: structural checks first, then scorers, then decision classifiers, then LLM/Suspicious catch-all.

flows:
  - id: chain-execution
    title: "Classifier Chain Execution"
    type: control
    trigger: "Pipeline.process() called by PipelineManager."
    steps:
      - node: classifier-chain
        action: "iterate sorted classifiers"
        condition: "verdict == Unknown AND not timed out"
        branch: "continue"
      - node: classifier-chain
        action: "call classifier.predict(email_info, pcfg, edb, urip)"
        condition: "classifier-specific thresholds and feature checks"
        gate: "validation"
      - node: classifier-chain
        action: "break on non-Unknown verdict"
        condition: "verdict != Unknown"
        branch: "set classifier_id, exit loop"
      - node: classification-pipeline
        action: "apply FNSubmission post-processing"
        condition: "EMAIL_SOURCE == 2 AND REWRITE_CLEAN_TO_NEWSLETTER"
        branch: "rewrite verdict"


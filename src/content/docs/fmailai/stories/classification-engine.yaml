id: classification-engine
title: "Classification Engine"
teaches: "How emails flow from Kafka through the classifier pipeline to produce verdicts."
tags: ["kafka", "pipeline", "classifiers", "core"]

anchor:
  file: "kafkaClientMT.py"
  line: 118
  description: "The main consumer loop that polls Kafka and dispatches to the thread pool."

parent: null
children:
  - "kafka-ingestion"
  - "classifier-pipeline"
  - "verdict-lifecycle"
  - "llm-integration"

summary: |
  **kafka-consumer** polls the FML-REQUEST topic, decompresses gzip+JSON payloads, and dispatches each email to **classification-pipeline** via a ThreadPoolExecutor. **classification-pipeline** checks the Aerospike email cache, evaluates trusted-sender bypass, then runs the **classifier-chain** -- an ordered sequence of 20+ classifiers sorted by ClassifierID priority. The first classifier to return a non-Unknown verdict ends the chain. Verdicts are produced back to per-appliance Kafka response topics.

structures:
  - id: engine-topology
    title: "Engine Component Topology"
    type: "component topology"
    nodes:
      - id: kafka-consumer
      - id: classification-pipeline
        children:
          - classifier-chain
    edges:
      - from: kafka-consumer
        to: classification-pipeline
        label: "dispatches via thread pool"
        type: "calls"
      - from: classification-pipeline
        to: classifier-chain
        label: "iterates ordered classifiers"
        type: "calls"

flows:
  - id: email-classification-flow
    title: "Email Classification Data Flow"
    type: data
    trigger: "FortiMail publishes email to FML-REQUEST."
    steps:
      - node: kafka-consumer
        action: "poll and decompress"
        data: "gzip+base64 JSON email"
        technology: "confluent_kafka Consumer"
      - node: kafka-consumer
        action: "submit to thread pool"
        to: classification-pipeline
        data: "EmailInfo object"
      - node: classification-pipeline
        action: "check email cache"
        to: europa-database
        data: "hash-based cache key"
      - node: classification-pipeline
        action: "run classifier chain"
        to: classifier-chain
        data: "EmailInfo with parsed features"
      - node: kafka-consumer
        action: "produce verdict response"
        data: "JSON verdict"
        technology: "confluent_kafka Producer"

observations:
  - id: obs-no-backpressure
    finding: "No backpressure mechanism between Kafka consumer and thread pool. executor.submit does not block when pool is full."
    confidence: high
    component: kafka-consumer
    evidence:
      file: "kafkaClientMT.py"
      lines: [92, 134]
    tags: ["resilience", "concurrency"]
    detection_method: manual
    recommendation: "Add a bounded queue or semaphore to limit in-flight work."
    grounded_in: ["kafkaClientMT.py:92", "kafkaClientMT.py:134"]
  - id: obs-commit-race
    finding: "Kafka offset commits happen on a time interval, not per-message. Reprocessing may occur after restart."
    confidence: high
    component: kafka-consumer
    evidence:
      file: "kafkaClientMT.py"
      lines: [93, 307]
    tags: ["data-integrity"]
    detection_method: manual
    recommendation: "Accept at-least-once semantics given idempotent email cache, or switch to synchronous per-batch commits."
    grounded_in: ["kafkaClientMT.py:93", "kafkaClientMT.py:307"]


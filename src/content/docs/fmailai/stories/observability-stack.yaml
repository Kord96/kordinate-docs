id: observability-stack
title: "Observability Stack"
teaches: "How Prometheus, Grafana, and exporters provide visibility into the classification system."
tags: ["prometheus", "grafana", "metrics", "monitoring"]

anchor:
  file: "prometheus.yml"
  line: 4
  description: "Prometheus scrape config targeting fai, kafka-exporter, and aerospike-exporter."

parent: operations
children: []

summary: |
  Prometheus scrapes three targets at 15s intervals: fai:8800 (application metrics), kafka-exporter:9308 (consumer lag, topic offsets), and aerospike-exporter:9145 (cluster health). Grafana at :3050 provides dashboards with a pre-configured Prometheus datasource. **kafka-consumer** exposes Histogram (process latency) and Counter (request/response by verdict) metrics via prometheus_client.

  Gaps: no metrics from **background-workers** or **vector-service**. No alerting rules configured. No correlation IDs across Kafka request-response cycle. print() statements in emailParseHelper.py bypass the structured JSON logger.

observations:
  - id: obs-missing-alerting
    finding: "Prometheus has no alerting rules configured. Silent failures in background workers or database connections go undetected."
    confidence: high
    component: background-workers
    evidence:
      file: "prometheus.yml"
      lines: [1, 15]
    tags: ["observability", "gap"]
    detection_method: manual
    recommendation: "Add alerting rules for consumer lag, process latency p99, and worker liveness."
    grounded_in: ["prometheus.yml:1"]

evaluation:

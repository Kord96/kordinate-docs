summary: |
  **email-model** centers on EmailInfo (1942 lines), parsing raw Kafka dicts into structured fields: envelope/header addresses, normalized subjects, deduplication hashes, and SPF/DKIM results. parse2() normalizes visible text. EmailParseHelper handles MIME decoding and NLTK preprocessing.

  Supporting modules: htmlParser.py (BeautifulSoup HTML-to-text with URL analysis), contentParser.py (SRG patterns, automation detection, calendar parsing), and uriPatterns.py (URI risk scoring).


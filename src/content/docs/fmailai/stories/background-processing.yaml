summary: |
  **background-workers** run as two Docker containers. merge_usr_pro triggers hourly profile merges at minute==1 and daily aggregate-and-cleanup at hour==1 UTC. dbclean calls AerospikeService.db_cleanup() in a continuous 30-second loop. Both use Aerospike UDF operations.

  Error handling is log-and-continue with no backoff or alerting. Scheduling uses manual datetime checks with time.sleep(30) rather than a cron library, so missed windows go undetected.


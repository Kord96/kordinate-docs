id: failure-cascades
title: "Failure Cascades"
teaches: "What breaks when each external dependency fails and how the system degrades."
tags: ["failure-modes", "resilience", "cascading"]

anchor:
  file: "kafkaClientMT.py"
  line: 126
  description: "Consumer error handling that closes on UNKNOWN_TOPIC_OR_PART."

parent: external-dependencies
children: []

summary: |
  Kafka failure is fatal: **kafka-consumer** closes on UNKNOWN_TOPIC_OR_PART, halting all classification. Aerospike failure degrades accuracy -- cache, sender stats, profiles unavailable, but classifiers continue. MongoDB failure freezes config refresh; stale caches persist until restart, when init fails.

  Qdrant and LLM failures are contained: both return Unknown, deferring to downstream classifiers. Thread pool exhaustion stalls the consumer poll loop, growing Kafka lag and timing out FortiMail verdicts.

flows:
  - id: kafka-failure-cascade
    title: "Kafka Broker Failure"
    type: control
    trigger: "Kafka broker unreachable or topic deleted."
    severity: critical
    detection: ["fmailai_request_count_inbound stops", "kafka-exporter consumer lag"]
    recovery: ["restart Kafka", "restart fai container"]
    steps:
      - node: kafka-consumer
        action: "poll returns error"
        condition: "KafkaError.UNKNOWN_TOPIC_OR_PART"
        branch: "close consumer"
        effect: "consumer.close() called, no recovery"
      - node: classification-pipeline
        action: "no new emails"
        effect: "classification halted"
  - id: aerospike-failure-cascade
    title: "Aerospike Failure"
    type: control
    trigger: "Aerospike server unreachable."
    severity: high
    detection: ["error logs from Aerospike operations", "aerospike-exporter metrics"]
    recovery: ["restart Aerospike container"]
    steps:
      - node: europa-database
        action: "operations raise exceptions"
        effect: "cache lookups, email inserts, sender stats fail"
      - node: classification-pipeline
        action: "continues with degraded accuracy"
        condition: "exception caught in Pipeline.process"
        branch: "classifiers run without historical context"

observations:
  - id: obs-no-kafka-reconnect
    finding: "Kafka consumer has no reconnection logic. UNKNOWN_TOPIC_OR_PART triggers permanent shutdown requiring container restart."
    confidence: high
    component: kafka-consumer
    evidence:
      file: "kafkaClientMT.py"
      lines: [128, 129]
    tags: ["resilience", "critical"]
    detection_method: manual
    recommendation: "Add reconnection with backoff for transient Kafka errors."
    grounded_in: ["kafkaClientMT.py:128"]
  - id: obs-stale-config
    finding: "MongoDB failure leaves the pipeline running with stale in-memory config. Config changes are silently lost until restart."
    confidence: high
    component: europa-database
    evidence:
      file: "database.py"
      lines: [260, 275]
    tags: ["resilience"]
    detection_method: manual
    recommendation: "Log a warning when config refresh fails and add a metric for config staleness."
    grounded_in: ["database.py:275"]

evaluation:
  groundedness: 0.93
  coverage: 0.90
  claim_count: 10
  ungrounded_claims: []

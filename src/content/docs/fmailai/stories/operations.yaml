summary: |
  **background-workers** run as two Docker containers: merge_usr_pro aggregates user profiles hourly and daily in Aerospike, while dbclean performs continuous TTL-based record aging. **vector-service** runs as a separate Flask container exposing /vectorize and /release endpoints for managing the Qdrant vector knowledge base. Both operate independently from the main classification engine, connected through shared Aerospike and Qdrant stores.


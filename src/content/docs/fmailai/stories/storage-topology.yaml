summary: |
  Aerospike holds email records (2-day TTL), sender stats (30 days), user profiles (7/60/91-day tiers), and cached verdicts (4 days). MongoDB stores all configuration: pipeline settings, classifier registry, domain rules, and phishing patterns. Legacy MySQL provides only config-change flag detection.

  **europa-database** maintains in-memory caches for MongoDB config, refreshed via CFG_LOADERS when cfg_change_status flags are set. Changes propagate within seconds via **kafka-consumer**'s per-batch isAnyCfgChanged check.


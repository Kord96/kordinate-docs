summary: |
  **kafka-consumer** subscribes to FML-REQUEST with auto.offset.reset=latest. Each message passes through a two-layer parse: a JSON wrapper with response_topic and base64 payload, then gzip decompression into the email fields dict. A fallback handles legacy FortiMail versions that omit the wrapper.

  Work dispatches via ThreadPoolExecutor (THREAD_POOL_SIZE, default 8). A daemon thread archives emails to rotating log via queue.Queue. Prometheus metrics instrument latency and verdict distribution. Offset commits run asynchronously every 1 second with a threading.Lock.


summary: |
  **europa-database** is a 3615-line facade wrapping Aerospike (email records, sender stats, user profiles, cached emails), MongoDB (pipeline config, classifier registry, domain rules, phishing patterns), and legacy MySQL (config change detection). In-memory config caches (home_domains, phishing rules, URI patterns) are loaded from MongoDB at startup and refreshed when cfg_change_status flags are set. **background-workers** run as separate containers for hourly/daily profile aggregation and record aging. **email-model** (emailinfo.py, 1942 lines) parses raw Kafka message dicts into a structured domain object with scoring, normalization, and hashing.


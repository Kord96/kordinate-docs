id: vector-similarity
title: "Vector Similarity Classification"
teaches: "How text embeddings and Qdrant vector search detect spam by content similarity."
tags: ["qdrant", "vectors", "similarity"]

anchor:
  file: "qdrantClassifier.py"
  line: 57
  description: "QdrantScoreClassifier.predict() performing vector search and rule evaluation."

parent: operations
children: []

summary: |
  QdrantScoreClassifier in **classifier-chain** vectorizes email text via **feature-extractor**, queries Qdrant for similar vectors, and evaluates expression-tree rules on matches. The expression tree provides AND/OR/NOT logic comparing email fields against thresholds.

  **vector-service** runs as a Flask container at :9000. /vectorize extracts visible text via BeautifulSoup, vectorizes with the sentence-transformer, returns 768-dim vectors. /release stores labeled vectors to Qdrant with 0.9 cosine duplicate detection.


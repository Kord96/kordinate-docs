summary: |
  **llm-client** calls a configurable LLM server via HTTP POST. LlmClassifier first evaluates suspicion signals (SPF, SRG, outbreaks, attachments) to skip the expensive call when unnecessary. Query content includes envelope/header fields plus 1024 chars of visible text, gzip-compressed when over 512 chars.

  A TTLCache (8000 entries, 24h TTL) keyed by MD5 avoids redundant calls. The LLM response risk_level drives a threshold cascade: >= 9 always Spam, >= 8 Spam with suspicious signals, >= 7 needs outbreak count >= 4, <= 2 may return Clean. Prometheus Histogram/Counter track latency and volume.


summary: |
  The system has three entry points: the FML-REQUEST Kafka topic (no authentication, relies on network isolation), and the vector-srv /vectorize and /release Flask endpoints (no authentication, CORS enabled for all origins). API key validation exists only for FortiMail ping/test-connection requests, checked against MongoDB cfg_pipelines.

  Secrets management is weak: config.py:53 contains a default MySQL password ('Spam123#db'), encryption.py:10 hardcodes an AES key as a character array, and the LLM server URL defaults to a private IP (10.4.2.130). No secrets rotation, no vault integration, no encrypted config. The AES cipher in encryption.py uses PyCrypto (deprecated, unmaintained) instead of cryptography.

